<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != '/' %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  </header>
  <main class="content">
    {{ content }}
  </main>
  <footer class="site-footer">
    <p>Naskah ini disusun ringkas untuk pelajar. Rujukan hadis dan pendapat ulama sebaiknya diperiksa ke kitab aslinya.</p>
  </footer>
  <script>
    // Teks Arab ditampilkan kanan-ke-kiri dengan huruf Arab.
    (function () {
      var arab = /[؀-ۿ]/g;
      document.querySelectorAll("main p").forEach(function (p) {
        var text = p.textContent.replace(/\s/g, "");
        if (!text) return;
        var hits = (text.match(arab) || []).length;
        if (hits / text.length > 0.6) {
          p.setAttribute("dir", "rtl");
          p.classList.add("ar");
        }
      });
    })();
  </script>
</body>
</html>
